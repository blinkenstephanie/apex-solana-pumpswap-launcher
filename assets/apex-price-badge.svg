<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="APEX Lifetime 3 SOL">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0A0A0F; }
      .accent { fill: #14F195; stroke: #14F195; }
      .white { fill: #E6EBF0; }
      .gray { fill: #788291; }
      .mono { font-family: ui-monospace, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-weight: 700; }
      .sans { font-family: 'Liberation Sans', 'DejaVu Sans', system-ui, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- soft outer glow ring -->
  <circle cx="400" cy="400" r="310" fill="#14F195" opacity="0.12" filter="url(#glow)"/>

  <!-- main badge disc -->
  <circle cx="400" cy="400" r="300" class="bg" stroke="#14F195" stroke-width="6"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#14F195" stroke-width="1.5" opacity="0.45"/>

  <!-- copy -->
  <text x="400" y="270" text-anchor="middle" class="mono accent" font-size="36" letter-spacing="0.18em">LIFETIME</text>
  <text x="400" y="400" text-anchor="middle" class="sans white" font-size="96">3 SOL</text>

  <!-- divider -->
  <rect x="260" y="455" width="280" height="6" rx="3" class="accent"/>

  <text x="400" y="520" text-anchor="middle" class="mono gray" font-size="22" font-weight="400">apexlauncher.fun</text>
  <text x="400" y="565" text-anchor="middle" class="mono gray" font-size="18" font-weight="400">one-time · self-hosted</text>
</svg>
